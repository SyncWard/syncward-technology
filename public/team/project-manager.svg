<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="acc4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bg4)" />
  
  <!-- Decorative Ring -->
  <circle cx="200" cy="160" r="85" fill="none" stroke="url(#acc4)" stroke-width="3" opacity="0.4" />
  
  <!-- Body -->
  <path d="M 100,340 C 100,270 145,260 200,260 C 255,260 300,270 300,340 Z" fill="#334155" />
  
