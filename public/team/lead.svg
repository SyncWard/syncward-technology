<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="acc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#286ef0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bg1)" />
  
  <!-- Decorative Ring -->
  <circle cx="200" cy="160" r="85" fill="none" stroke="url(#acc1)" stroke-width="3" opacity="0.4" />
  
  <!-- Avatar Body / Shoulders -->
  <path d="M 100,340 C 100,270 145,260 200,260 C 255,260 300,270 300,340 Z" fill="#334155" />
  
  <!-- Neck -->
  <rect x="180" y="220" width="40" height="50" fill="#cbd5e1" />

  <!-- Head -->
  <circle cx="200" cy="160" r="65" fill="#e2e8f0" />
  
  <!-- Hair (Modern Tech Cut) -->
  <path d="M 135,140 C 135,100 165,90 200,90 C 235,90 265,100 265,140 C 265,150 260,135 255,120 C 240,95 220,95 200,95 C 180,95 160,95 145,120 C 140,135 135,150 135,140 Z" fill="#0f172a" />

  <!-- Tech Badge / Glasses Accent -->
  <rect x="140" y="295" width="120" height="30" rx="15" fill="#0f172a" stroke="#286ef0" stroke-width="1.5" />
  <text x="200" y="315" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">Tech Lead</text>
</svg>
