<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="acc2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="36" fill="url(#bg2)" />
  
  <!-- Decorative Ring -->
  <circle cx="200" cy="160" r="85" fill="none" stroke="url(#acc2)" stroke-width="3" opacity="0.4" />
  
  <!-- Body -->
  <path d="M 100,340 C 100,270 145,260 200,260 C 255,260 300,270 300,340 Z" fill="#334155" />
  
  <!-- Neck -->
  <rect x="180" y="220" width="40" height="50" fill="#cbd5e1" />

  <!-- Head -->
  <circle cx="200" cy="160" r="65" fill="#e2e8f0" />
  
  <!-- Hair (Creative Style) -->
  <path d="M 135,150 C 135,95 160,85 200,85 C 240,85 265,95 265,150 C 265,120 250,90 200,90 C 150,90 135,120 135,150 Z" fill="#1e293b" />

  <!-- Designation Badge -->
  <rect x="130" y="295" width="140" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <text x="200" y="315" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">UI/UX Designer</text>
</svg>
